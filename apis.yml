aid: sensi-fka-clanz
name: Sensi (fka Clanz)
description: 'Sensi.ai (formerly Clanz) is a home-care technology company whose 24/7
  Care Copilot is an AI platform for senior home-care agencies. Using ambient audio
  sensing and a set of AI agents (Care, Growth, and Ops), Sensi gives care providers
  a holistic view of seniors'' physical, emotional, and cognitive needs to support
  aging in place and proactive intervention when no caregiver is present. The company
  markets reduced hospitalizations, revenue growth, and operational efficiency for
  agencies. Sensi is backed by Insight Partners. No public developer API, documentation,
  or well-known discovery surface was found during enrichment; the customer application
  lives at app.sensi.ai.'
